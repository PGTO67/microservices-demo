apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgenerator
  labels:
    app: loadgenerator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgenerator
  template:
    metadata:
      labels:
        app: loadgenerator
    spec:
      containers:
      - name: loadgenerator
        image: 982105689473.dkr.ecr.us-east-2.amazonaws.com/loadgenerator:latest
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: loadgenerator
spec:
  selector:
    app: loadgenerator
  type: ClusterIP
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
